name: Update KMS policy

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Target cloud: azure (confcom hostdata) or gcp (Confidential Space container_measurement)'
        required: true
        type: choice
        default: azure
        options:
          - azure
          - gcp
      kms_target_environment:
        description: 'KMS: UAT or Prod deployment environment (azure path only)'
        required: true
        type: choice
        default: uat
        options:
          - uat
          - prod
      key_release_policy_operation:
        description: 'Add or remove CCE policy hashes from the key release policy'
        required: true
        type: choice
        default: add
        options:
          - add
          - remove
      bidding-auction-version:
        description: 'Release Version for Bidding and Auction Services'
        required: true
        type: string
        default: '4.8.1.3'
      kv-services-version:
        description: 'Release Version for Key-Value Service'
        required: true
        type: string
        default: '1.2.1.2'
      gcp_image_refs:
        description: 'GCP path: full image references, ONE PER LINE (Confidential Space images to allowlist)'
        required: false
        type: string
        default: |
          us-central1-docker.pkg.dev/p3dx-depa-sandbox/bidding-auction/bidding_service:kms-e2e-nonprod-v2
      gcp_dbgstat:
        description: 'GCP path: dbgstat value to pin (prod: disabled-since-boot; nonprod: enabled; empty = do not pin)'
        required: false
        type: string
        default: ''
      gcp_pin_secboot:
        description: 'GCP path: also require secboot=true'
        required: false
        type: boolean
        default: true

jobs:
  update-kms-policy:
    # azure -> azure-uat/azure-prod (private KV + AKV signing). gcp -> gcp-dev
    # (local member-cert signing, no KV/AKV needed).
    environment: ${{ github.event.inputs.cloud == 'gcp' && 'gcp-dev' || (github.event.inputs.kms_target_environment == 'uat' && 'azure-uat' || 'azure-prod') }}
    # azure: self-hosted + uat|prod (must reach private KV + confidential ledger).
    # gcp:   self-hosted + gcp (local signing; only the public ledger endpoint).
    runs-on: ${{ fromJSON(github.event.inputs.cloud == 'gcp' && '["self-hosted", "gcp"]' || (github.event.inputs.kms_target_environment == 'uat' && '["self-hosted", "uat"]' || '["self-hosted", "prod"]')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        if: ${{ inputs.cloud != 'gcp' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_AKS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_AKS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_AKS_SUBSCRIPTION_ID }}
      
      - name: Setup Build Environment
        if: ${{ inputs.cloud != 'gcp' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

          sudo apt-get remove -y docker docker-engine docker.io containerd runc || true
          sudo apt-get autoremove -y
          sudo apt-get install -y \
            apt-transport-https ca-certificates curl gnupg lsb-release \
            libssl-dev libcurl4-openssl-dev libprotobuf-dev protobuf-compiler pkg-config \
            python3-venv
          
          sudo apt-get clean && sudo apt-get autoclean
          sudo rm -rf /var/lib/apt/lists/*
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh && rm get-docker.sh
          sudo usermod -aG docker $USER
          docker --version

          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $USER

      - name: Install Azure CLI & Confcom extension
        if: ${{ inputs.cloud != 'gcp' }}
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az version
          CONFCOM_VERSION=$(tr -d '[:space:]' < policies/confcom.version)
          az extension remove --name confcom 2>/dev/null || true
          az extension add --name confcom --version "$CONFCOM_VERSION"
          az extension list --query "[?name=='confcom'].[name,version]" -o tsv

      - name: Setup Python virtual environment
        run: |
          # Create virtual environment
          python3 -m venv ccf_env
          
          # Activate virtual environment and install CCF
          source ccf_env/bin/activate
          pip install --upgrade pip
          pip install ccf==6.0.10
                    
          # Add virtual environment to PATH for subsequent steps
          echo "ccf_env/bin" >> $GITHUB_PATH

      - name: Generate CCE policies for services
        if: ${{ inputs.cloud != 'gcp' }}
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REPO_PATH: ${{ vars.REPO_PATH }}
          KMS_TARGET: ${{ github.event.inputs.kms_target_environment }}
          KV_VERSION: ${{ inputs.kv-services-version }}
          BA_VERSION: ${{ inputs.bidding-auction-version }}
        run: |
          set -euo pipefail

          # Accept bare semver inputs; strip legacy prod-/nonprod- prefix if present.
          KV_VERSION="${KV_VERSION#prod-}"
          KV_VERSION="${KV_VERSION#nonprod-}"
          BA_VERSION="${BA_VERSION#prod-}"
          BA_VERSION="${BA_VERSION#nonprod-}"

          if [ "$KMS_TARGET" = "uat" ]; then
            IMAGE_FLAVOR="nonprod"
            PROD_KMS_URL="https://depa-inferencing-kms-azure.ispirt.in"
            UAT_KMS_URL="https://depa-inferencing-kms-uat-azure.ispirt.in"
          else
            IMAGE_FLAVOR="prod"
          fi

          KV_TAG="${IMAGE_FLAVOR}-${KV_VERSION}"
          BA_TAG="${IMAGE_FLAVOR}-${BA_VERSION}"

          TMP_DIR=$(mktemp -d)
          POLICY_DIR="$TMP_DIR"
          for policy in kv-policy.json ofe-policy.json offer-policy.json; do
            cp "policies/$policy" "$POLICY_DIR/$policy"
          done

          if [ "$KMS_TARGET" = "uat" ]; then
            for policy in kv-policy.json ofe-policy.json offer-policy.json; do
              sed -i "s|${PROD_KMS_URL}|${UAT_KMS_URL}|g" "$POLICY_DIR/$policy"
            done
          fi

          sed -i "s|key-value-service:[^\"]*|key-value-service:${KV_TAG}|" "$POLICY_DIR/kv-policy.json"
          sed -i "s|buyer-frontend-service:[^\"]*|buyer-frontend-service:${BA_TAG}|" "$POLICY_DIR/ofe-policy.json"
          sed -i "s|bidding-service:[^\"]*|bidding-service:${BA_TAG}|" "$POLICY_DIR/offer-policy.json"

          echo "Policy templates for confcom (${KMS_TARGET}, ${IMAGE_FLAVOR}):"
          grep '"image"' "$POLICY_DIR"/*.json

          echo "IMAGE_FLAVOR=$IMAGE_FLAVOR" >> $GITHUB_ENV
          echo "KV_TAG=$KV_TAG" >> $GITHUB_ENV
          echo "BA_TAG=$BA_TAG" >> $GITHUB_ENV

          docker pull ${REGISTRY}/${REPO_PATH}/key-value-service:${KV_TAG}
          KV_POLICY=$(az confcom acipolicygen -y -i ${POLICY_DIR}/kv-policy.json --print-policy | base64 --decode | sha256sum | cut -d' ' -f1)
          echo "KV_POLICY=$KV_POLICY" >> $GITHUB_ENV

          docker pull ${REGISTRY}/${REPO_PATH}/buyer-frontend-service:${BA_TAG}
          OFE_POLICY=$(az confcom acipolicygen -y -i ${POLICY_DIR}/ofe-policy.json --print-policy | base64 --decode | sha256sum | cut -d' ' -f1)
          echo "OFE_POLICY=$OFE_POLICY" >> $GITHUB_ENV

          docker pull ${REGISTRY}/${REPO_PATH}/bidding-service:${BA_TAG}
          OFFER_POLICY=$(az confcom acipolicygen -y -i ${POLICY_DIR}/offer-policy.json --print-policy | base64 --decode | sha256sum | cut -d' ' -f1)
          echo "OFFER_POLICY=$OFFER_POLICY" >> $GITHUB_ENV

          echo "CCE policies generated for all services"
          echo "KV hostdata:    $KV_POLICY"
          echo "OFE hostdata:   $OFE_POLICY"
          echo "Offer hostdata: $OFFER_POLICY"

          if [ "$KMS_TARGET" = "uat" ]; then
            ALLOWALL_PATH="${GITHUB_WORKSPACE}/deployment-scripts/azure/offer-service/environment/demo/cce-policies/allow_all.base64"
            ALLOWALL_POLICY=$(base64 --decode < "$ALLOWALL_PATH" | sha256sum | cut -d' ' -f1)
            echo "ALLOWALL_POLICY=$ALLOWALL_POLICY" >> $GITHUB_ENV
            echo "Allow-all policy hash: $ALLOWALL_POLICY"
          else
            echo "ALLOWALL_POLICY=" >> $GITHUB_ENV
          fi

          rm -rf "$TMP_DIR"

      - name: Generate key release policy JSON
        if: ${{ inputs.cloud != 'gcp' }}
        env:
          KMS_TARGET: ${{ github.event.inputs.kms_target_environment }}
          POLICY_OPERATION: ${{ github.event.inputs.key_release_policy_operation }}
          KMS_DEPLOYMENT_NAME: ${{ vars.KMS_CONFIDENTIAL_LEDGER }}
          KV_TAG: ${{ env.KV_TAG }}
          BA_TAG: ${{ env.BA_TAG }}
          KV_POLICY: ${{ env.KV_POLICY }}
          OFE_POLICY: ${{ env.OFE_POLICY }}
          OFFER_POLICY: ${{ env.OFFER_POLICY }}
          ALLOWALL_POLICY: ${{ env.ALLOWALL_POLICY }}
        run: |
          GOV_BASE="https://${KMS_DEPLOYMENT_NAME}.confidential-ledger.azure.com"
          GOV_BASE="${GOV_BASE%/}"
          TOKEN=$(az account get-access-token --resource https://confidential-ledger.azure.com | jq -r '.accessToken')

          CURRENT_POLICY=$(curl -sS -k "$GOV_BASE/app/keyReleasePolicy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN")

          if ! echo "$CURRENT_POLICY" | jq -e '.claims' >/dev/null 2>&1; then
            echo "Failed to fetch or parse current key release policy from $GOV_BASE/app/keyReleasePolicy"
            echo "$CURRENT_POLICY"
            exit 1
          fi

          echo "Current key release policy:"
          echo "$CURRENT_POLICY" | jq .

          EXISTING_HOSTDATA=$(echo "$CURRENT_POLICY" | jq -c '.claims["x-ms-sevsnpvm-hostdata"] // []')
          echo "Existing x-ms-sevsnpvm-hostdata claims:"
          echo "$EXISTING_HOSTDATA" | jq -r '.[]?'

          CANDIDATES=$(jq -n \
            --arg kv "$KV_POLICY" \
            --arg ofe "$OFE_POLICY" \
            --arg offer "$OFFER_POLICY" \
            --arg allowall "$ALLOWALL_POLICY" \
            --arg kms_target "$KMS_TARGET" \
            '
              [$kv, $ofe, $offer]
              + if ($kms_target == "uat" and ($allowall | length) > 0)
                then [$allowall]
                else []
                end
            ')

          echo "Requested claims for this run:"
          echo "  KV (${KV_TAG}): $KV_POLICY"
          echo "  OFE (${BA_TAG}): $OFE_POLICY"
          echo "  Offer (${BA_TAG}): $OFFER_POLICY"
          if [ "$KMS_TARGET" = "uat" ] && [ -n "$ALLOWALL_POLICY" ]; then
            echo "  Allow-all: $ALLOWALL_POLICY"
          fi

          if [ "$POLICY_OPERATION" = "add" ]; then
            FILTERED=$(jq -n \
              --argjson existing "$EXISTING_HOSTDATA" \
              --argjson candidates "$CANDIDATES" \
              '$candidates | map(select(. as $c | ($existing | index($c)) | not))')
            SKIPPED=$(jq -n \
              --argjson existing "$EXISTING_HOSTDATA" \
              --argjson candidates "$CANDIDATES" \
              '$candidates | map(select(. as $c | ($existing | index($c)) != null))')
            SKIP_REASON="already present"
          else
            FILTERED=$(jq -n \
              --argjson existing "$EXISTING_HOSTDATA" \
              --argjson candidates "$CANDIDATES" \
              '$candidates | map(select(. as $c | ($existing | index($c)) != null))')
            SKIPPED=$(jq -n \
              --argjson existing "$EXISTING_HOSTDATA" \
              --argjson candidates "$CANDIDATES" \
              '$candidates | map(select(. as $c | ($existing | index($c)) | not))')
            SKIP_REASON="not present"
          fi

          echo "Claims to ${POLICY_OPERATION}:"
          echo "$FILTERED" | jq -r '.[]?'

          SKIPPED_COUNT=$(echo "$SKIPPED" | jq 'length')
          if [ "$SKIPPED_COUNT" -gt 0 ]; then
            echo "Skipped (${SKIP_REASON}):"
            echo "$SKIPPED" | jq -r '.[]?'
          fi

          FILTERED_COUNT=$(echo "$FILTERED" | jq 'length')
          if [ "$FILTERED_COUNT" -eq 0 ]; then
            echo "No claims to ${POLICY_OPERATION}; skipping proposal submission."
            echo "SUBMIT_PROPOSAL=false" >> $GITHUB_ENV
            exit 0
          fi

          jq -n \
            --arg op "$POLICY_OPERATION" \
            --argjson hostdata "$FILTERED" \
            '{
              actions: [{
                name: "set_key_release_policy",
                args: {
                  service: "offer-services",
                  type: $op,
                  claims: {
                    "x-ms-sevsnpvm-hostdata": $hostdata
                  }
                }
              }]
            }' > "$GITHUB_WORKSPACE/key_release_policy.json"

          echo "SUBMIT_PROPOSAL=true" >> $GITHUB_ENV
          echo "Key release policy JSON generated ($POLICY_OPERATION): key_release_policy.json"
          cat "$GITHUB_WORKSPACE/key_release_policy.json"
    
      - name: Sign and submit key release policy proposal
        if: ${{ inputs.cloud != 'gcp' && env.SUBMIT_PROPOSAL == 'true' }}
        env:
          AZURE_VAULT_NAME: ${{ vars.KMS_SIGNING_KV }}
          KMS_DEPLOYMENT_NAME: ${{ vars.KMS_CONFIDENTIAL_LEDGER }}
          PROPOSAL: ${{ github.workspace }}/key_release_policy.json
        run: |
          # Activate the virtual environment
          source ccf_env/bin/activate

          # Run the signing script
          ./tools/signing/sign.sh

      - name: Display current key release policy
        if: ${{ inputs.cloud != 'gcp' }}
        env:
          KMS_DEPLOYMENT_NAME: ${{ vars.KMS_CONFIDENTIAL_LEDGER }}
        run: |
          GOV_BASE="https://${KMS_DEPLOYMENT_NAME}.confidential-ledger.azure.com"
          GOV_BASE="${GOV_BASE%/}"
          TOKEN=$(az account get-access-token --resource https://confidential-ledger.azure.com | jq -r '.accessToken')
          # -k: quick post-submit display; sign.sh does full TLS verify to governance
          curl -sS -k "$GOV_BASE/app/keyReleasePolicy" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" | jq

      # ======================================================================
      # GCP path (Confidential Space). No Azure login, no confcom, no Key Vault:
      # the measurement is derived from image metadata and the proposal is signed
      # LOCALLY with the on-disk member cert (vars.KMS_KEYS_DIR), then submitted
      # to the public GCP KMS ledger. Mirrors the Azure hostdata flow above but
      # registers `container_measurement` (+ optional dbgstat/secboot posture).
      # ======================================================================
      - name: GCP - compute container measurements and build proposal
        if: ${{ inputs.cloud == 'gcp' }}
        env:
          IMAGE_REFS: ${{ inputs.gcp_image_refs }}
          POLICY_OPERATION: ${{ inputs.key_release_policy_operation }}
          GCP_DBGSTAT: ${{ inputs.gcp_dbgstat }}
          PIN_SECBOOT: ${{ inputs.gcp_pin_secboot }}
          KMS_DEPLOYMENT_NAME: ${{ vars.KMS_CONFIDENTIAL_LEDGER }}
        run: |
          set -euo pipefail

          # The GCP KMS ledger endpoint is public (Confidential Space calls it);
          # the ledger presents its own CCF cert, fetched from the public identity
          # endpoint and used as the CA for governance calls.
          KMS_URL="https://${KMS_DEPLOYMENT_NAME}.confidential-ledger.azure.com"
          SVC="${GITHUB_WORKSPACE}/gcp_service_cert.pem"
          curl -sS "https://identity.confidential-ledger.core.azure.com/ledgerIdentity/${KMS_DEPLOYMENT_NAME}" \
            | jq -r '.ledgerTlsCertificate' > "$SVC"
          echo "KMS_URL=$KMS_URL" >> $GITHUB_ENV
          echo "KMS_SERVICE_CERT_PATH=$SVC" >> $GITHUB_ENV

          # Drift guard: fail fast if the vendored canonicaliser no longer matches
          # the golden value the KMS is locked to.
          node tools/gcp/gcp_container_measurement.mjs --self-test

          # One measurement per image ref, derived purely from image metadata
          # (no full pull): image_digest = manifest digest, image_id = config
          # digest, args = Entrypoint + Cmd, restart_policy = Never.
          MEASUREMENTS=()
          while IFS= read -r RAW; do
            REF="$(echo "$RAW" | xargs)"
            [ -z "$REF" ] && continue
            echo "::group::$REF"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
            IMAGE_ID=$(docker manifest inspect "$REF" | jq -r '.config.digest')
            ARGS=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' \
              | jq -c '(.config // (to_entries[0].value.config)) as $c | (($c.Entrypoint // []) + ($c.Cmd // []))')
            echo "  image_digest=$IMAGE_DIGEST"
            echo "  image_id=$IMAGE_ID"
            echo "  args=$ARGS"
            M=$(node tools/gcp/gcp_container_measurement.mjs \
                  --image-digest "$IMAGE_DIGEST" --image-id "$IMAGE_ID" \
                  --restart-policy Never --args "$ARGS")
            echo "  container_measurement=$M"
            MEASUREMENTS+=("$M")
            echo "::endgroup::"
          done <<< "$IMAGE_REFS"

          if [ "${#MEASUREMENTS[@]}" -eq 0 ]; then
            echo "No image refs provided in gcp_image_refs; nothing to do."
            echo "SUBMIT_PROPOSAL=false" >> $GITHUB_ENV
            exit 0
          fi

          # Build the claims object. container_measurement is an allowlist; the
          # set_gcp_key_release_policy action dedupes on add and filters on remove.
          # dbgstat/secboot posture claims are only pinned when requested.
          CLAIMS=$(printf '%s\n' "${MEASUREMENTS[@]}" | jq -R . | jq -s '{container_measurement: .}')
          if [ -n "$GCP_DBGSTAT" ]; then
            CLAIMS=$(echo "$CLAIMS" | jq --arg d "$GCP_DBGSTAT" '. + {dbgstat: [$d]}')
          fi
          if [ "$PIN_SECBOOT" = "true" ]; then
            CLAIMS=$(echo "$CLAIMS" | jq '. + {secboot: ["true"]}')
          fi

          jq -n --arg op "$POLICY_OPERATION" --argjson claims "$CLAIMS" \
            '{ actions: [ { name: "set_gcp_key_release_policy",
                            args: { type: $op, claims: $claims } } ] }' \
            > "${GITHUB_WORKSPACE}/gcp_key_release_policy.json"

          echo "SUBMIT_PROPOSAL=true" >> $GITHUB_ENV
          echo "Generated GCP key release policy proposal ($POLICY_OPERATION):"
          jq . "${GITHUB_WORKSPACE}/gcp_key_release_policy.json"

      - name: GCP - sign locally and submit proposal
        if: ${{ inputs.cloud == 'gcp' && env.SUBMIT_PROPOSAL == 'true' }}
        env:
          KMS_URL: ${{ env.KMS_URL }}
          KMS_SERVICE_CERT_PATH: ${{ env.KMS_SERVICE_CERT_PATH }}
          KEYS_DIR: ${{ vars.KMS_KEYS_DIR }}
        run: |
          set -euo pipefail
          source ccf_env/bin/activate
          # Local (USE_AKV=false) COSE signing with the on-disk member cert - the
          # dev KMS Key Vault is private, so AKV remote signing is not reachable.
          ccf_cose_sign1 \
            --content "${GITHUB_WORKSPACE}/gcp_key_release_policy.json" \
            --signing-cert "${KEYS_DIR}/member0_cert.pem" \
            --signing-key "${KEYS_DIR}/member0_privk.pem" \
            --ccf-gov-msg-type proposal \
            --ccf-gov-msg-created_at "$(date -Is)" \
          | curl -sS --cacert "${KMS_SERVICE_CERT_PATH}" \
              -X POST -H "Content-Type: application/cose" \
              --data-binary @- \
              "${KMS_URL}/app/proposals" -w '\nHTTP %{http_code}\n'

      - name: GCP - display key release policy
        if: ${{ inputs.cloud == 'gcp' }}
        env:
          KMS_URL: ${{ env.KMS_URL }}
          KMS_SERVICE_CERT_PATH: ${{ env.KMS_SERVICE_CERT_PATH }}
        run: |
          echo "=== GCP key release policy (Gate 2) ==="
          curl -sS --cacert "${KMS_SERVICE_CERT_PATH}" \
            "${KMS_URL}/app/keyReleasePolicy?attestationType=gcp" | jq
